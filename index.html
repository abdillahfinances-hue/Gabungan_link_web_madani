<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madani Hub</title>
<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#14261f; --muted:#5a6b64; --line:#d5e0da; --accent:#0f6b4f; --accent-ink:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0e1a15; --surface:#16261f; --ink:#e6f0ea; --muted:#93a79d; --line:#274236; --accent:#4cc79a; --accent-ink:#06150f; }
}
:root[data-theme="dark"]{ --bg:#0e1a15; --surface:#16261f; --ink:#e6f0ea; --muted:#93a79d; --line:#274236; --accent:#4cc79a; --accent-ink:#06150f; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:20px}
.search:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.item .txt{flex:1;min-width:0}
.item h2{font-size:1.05rem;margin:0 0 2px}
.item p{margin:0;color:var(--muted);font-size:.9rem}
.item small{display:block;color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.btns{display:flex;gap:8px;flex-shrink:0}
.open{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:9px 14px;border-radius:8px;font-size:.9rem}
.copy{background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px 12px;border-radius:8px;font:inherit;font-size:.9rem;cursor:pointer}
.empty{color:var(--muted);padding:20px 0;display:none}
@media (max-width:520px){ .item{flex-direction:column;align-items:stretch} .btns .open{flex:1;text-align:center} }
</style>
</head>
<body>
<main>
  <h1>Madani Hub</h1>
  <p class="sub">Semua link Bimbel Private Madani dalam satu tempat.</p>
  <input class="search" id="q" type="search" placeholder="Cari link…" aria-label="Cari link">
  <div class="list" id="list"></div>
  <p class="empty" id="empty">Tidak ada link yang cocok.</p>
</main>
<script>
var LINKS=[
 {t:"Madani Karir",d:"Sistem rekrutmen dan lowongan kerja",u:"https://abdillahfinances-hue.github.io/Madani_Karir/"},
 {t:"Pendaftaran Murid Baru",d:"Form pendaftaran murid baru Bimbel Private Madani",u:"https://abdillahfinances-hue.github.io/Pendaftaran_Murid_Baru_Bimbel_Private_Madani/"},
 {t:"Modul Online Madani Education",d:"Website modul belajar online",u:"https://abdillahfinances-hue.github.io/Website-ModulOnline-MadaniEducation1/"},
 {t:"Games Education Madani",d:"Game edukasi untuk murid",u:"https://abdillahfinances-hue.github.io/Games_Education_BB_Madani/"}
];
var list=document.getElementById('list'),q=document.getElementById('q'),empty=document.getElementById('empty');
function render(f){
  list.innerHTML='';var n=0;
  LINKS.forEach(function(l){
    if(f&&(l.t+' '+l.d).toLowerCase().indexOf(f)<0)return;
    n++;
    var el=document.createElement('div');el.className='item';
    var txt=document.createElement('div');txt.className='txt';
    var h=document.createElement('h2');h.textContent=l.t;
    var p=document.createElement('p');p.textContent=l.d;
    var s=document.createElement('small');s.textContent=l.u;
    txt.appendChild(h);txt.appendChild(p);txt.appendChild(s);
    var b=document.createElement('div');b.className='btns';
    var a=document.createElement('a');a.className='open';a.href=l.u;a.target='_blank';a.rel='noopener';a.textContent='Buka';
    var c=document.createElement('button');c.className='copy';c.type='button';c.textContent='Salin';
    c.addEventListener('click',function(){
      var done=function(){c.textContent='Tersalin';setTimeout(function(){c.textContent='Salin'},1500)};
      try{navigator.clipboard.writeText(l.u).then(done,function(){})}catch(e){}
    });
    b.appendChild(a);b.appendChild(c);
    el.appendChild(txt);el.appendChild(b);list.appendChild(el);
  });
  empty.style.display=n?'none':'block';
}
q.addEventListener('input',function(){render(q.value.trim().toLowerCase())});
render('');
</script>
</body>
</html>
